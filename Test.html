<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test HTML Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 30px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 36px;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            color: #16a34a;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Hello 👋</h1>

            <p>
                This is a test HTML page.
            </p>

            <button onclick="testButton()">
                Click Me
            </button>

            <div id="message"></div>
        </div>
    </div>

    <script>
        function testButton() {
            document.getElementById("message").textContent =
                "Button is working successfully! ✅";
        }
    </script>

</body>
</html>
